name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 契约测试直接加载 dist/index.cjs，必须先构建再测试
      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Check sync gate
        run: npm run check-sync

      - name: Upload plugin artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: astral-relay-plugin
          path: dist/plugin/astral-relay/
          if-no-files-found: error
